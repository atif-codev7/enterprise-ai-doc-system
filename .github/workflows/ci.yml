name: Enterprise DocIntel CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test-eval:
    name: Backend Test Suite & Ragas Quantitative Evaluation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: docintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Pytest Suite (Unit, Vector, LangGraph, Tools)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/docintel
          EMBEDDING_PROVIDER: mock
          LLM_PROVIDER: deterministic-sim
        run: |
          cd backend
          pytest -v --tb=short

      - name: Verify Ragas Benchmark Thresholds
        run: |
          python -c "
          from backend.app.evaluation.ragas_evaluator import ragas_evaluator
          from backend.app.evaluation.benchmark_dataset import BENCHMARK_SAMPLES
          report = ragas_evaluator.evaluate_dataset(BENCHMARK_SAMPLES)
          print(f'Ragas Faithfulness: {report.mean_faithfulness:.2%}')
          print(f'Ragas Context Relevance: {report.mean_context_relevance:.2%}')
          print(f'Ragas Answer Relevance: {report.mean_answer_relevance:.2%}')
          print(f'Ragas Composite Score: {report.mean_overall_score:.2%}')
          assert report.mean_faithfulness >= 0.70, 'Faithfulness benchmark failed below 70%'
          assert report.mean_context_relevance >= 0.50, 'Context relevance failed below 50%'
          print('Enterprise Ragas SLA benchmarks successfully passed!')
          "

  docker-build:
    name: Docker Container Build Verification
    needs: backend-test-eval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: docintel-backend:test

      - name: Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: docintel-frontend:test
